  "divergences": [
    {
      "id": "adr-0001-application-imports-outward",
      "summary": "La capa de aplicación importa compare, discovery (legacy) e infraestructura, y el CLI abre conexiones SQL Server directamente",
      "documented": "docs/architecture/decisions/0001-hexagonal-architecture-and-dependency-rules.md:28",
      "evidence": ["src/schema_comparator/application/use_cases/compare_profiles.py:7", "src/schema_comparator/application/services/extraction.py:16", "src/schema_comparator/cli.py:90"]
    },
    {
      "id": "adr-0002-eager-pyodbc",
      "summary": "La carga diferida no se cumple: registry y config importan en cadena módulos que hacen import pyodbc al cargarse; sin libodbc (Linux/macOS) no arranca ni con proveedores no SQL Server",
      "documented": "docs/architecture/decisions/0002-internal-provider-registry.md:20",
      "evidence": ["src/schema_comparator/infrastructure/providers/registry.py:6", "src/schema_comparator/discovery/service.py:5", "src/schema_comparator/config/connection_string.py:6"]
    },
    {
      "id": "adr-0002-providers-doctor",
      "summary": "El diagnóstico 'bdiff providers doctor' citado como consecuencia no existe",
      "documented": "docs/architecture/decisions/0002-internal-provider-registry.md:27",
      "evidence": ["src/schema_comparator/cli.py:17"]
    },
    {
      "id": "adr-0003-canonical-types-unused",
      "summary": "SqlType y TypeFamily no se usan; las columnas guardan data_type como texto y type_equivalences usa otro vocabulario de familias",
      "documented": "docs/architecture/decisions/0003-canonical-type-system-and-comparison-modes.md:15",
      "evidence": ["src/schema_comparator/domain/schema/types.py:20", "src/schema_comparator/domain/schema/models.py:29"]
    },
    {
      "id": "adr-0003-native-strict-mixed-providers",
      "summary": "native-strict no limita la comparación a un mismo motor ni avisa, y el modo semantic no es accesible desde CLI ni TUI",
      "documented": "docs/architecture/decisions/0003-canonical-type-system-and-comparison-modes.md:18",
      "evidence": ["src/schema_comparator/compare/engine.py:113", "src/schema_comparator/application/use_cases/compare_profiles.py:71"]
    },
    {
      "id": "adr-0004-pyodbc-mandatory",
      "summary": "pyodbc sigue siendo dependencia obligatoria además de extra, y no se emite aviso de deprecación para el formato databases:",
      "documented": "docs/architecture/decisions/0004-configuration-v2-and-backwards-compatibility.md:31",
      "evidence": ["pyproject.toml:14", "src/schema_comparator/config/loader.py:44"]
    },
    {
      "id": "adr-0005-no-migration-plan",
      "summary": "No hay plan de migración neutro ni clasificación SAFE/DESTRUCTIVE; la consolidación llama directamente al renderer T-SQL",
      "documented": "docs/architecture/decisions/0005-decoupled-write-only-script-generation.md:18",
      "evidence": ["src/schema_comparator/compare/consolidation.py:13"]
    },
    {
      "id": "adr-0006-late-confirmation",
      "summary": "--refresh-modules sin --yes se rechaza después de extraer, comparar y escribir reportes, no antes de abrir conexiones",
      "documented": "docs/architecture/decisions/0006-mantenimiento-de-metadatos-con-confirmacion.md:36",
      "evidence": ["src/schema_comparator/cli.py:179"]
    },
    {
      "id": "baseline-secret-leak",
      "summary": "Los errores de MySQL/MariaDB y Oracle, y los del CLI de rutinas, interpolan el texto del driver, que puede incluir host y usuario",
      "documented": "docs/architecture/technical-baseline.md:19",
      "evidence": ["src/schema_comparator/infrastructure/providers/mysql_family/errors.py:12", "src/schema_comparator/infrastructure/providers/oracle/errors.py:12", "src/schema_comparator/cli.py:140"]
    },
    {
      "id": "spec-schema-extraction-sqlserver-only",
      "summary": "El spec describe solo SQL Server con tablas y columnas; el código tiene 6 proveedores y extrae rutinas",
      "documented": "openspec/specs/schema-extraction/spec.md:5",
      "evidence": ["src/schema_comparator/infrastructure/providers/registry.py:100"]
    },
    {
      "id": "spec-comparison-engine-attributes",
      "summary": "El spec fija 5 atributos de columna y 3 tipos de hallazgo; el código compara 8 atributos y emite 8 tipos de hallazgo",
      "documented": "openspec/specs/comparison-engine/spec.md:70",
      "evidence": ["src/schema_comparator/domain/comparison/models.py:72"]
    },
    {
      "id": "spec-reporting-file-names",
      "summary": "El spec exige archivos con guion directamente en reportes/; el código usa subcarpeta por timestamp y guion bajo",
      "documented": "openspec/specs/reporting-and-output/spec.md:29",
      "evidence": ["src/schema_comparator/report/write.py:37"]
    },
    {
      "id": "spec-interactive-tui-read-only",
      "summary": "El spec define una TUI de solo lectura; la TUI re-ejecuta, genera scripts y recompila rutinas",
      "documented": "openspec/specs/interactive-tui/spec.md:5",
      "evidence": ["src/schema_comparator/tui/app.py:337"]
    },
    {
      "id": "spec-connection-profile-v1-only",
      "summary": "El spec sigue en formato delta y solo contempla databases:; el código soporta profiles: v2 con provider y options",
      "documented": "openspec/specs/connection-profile-config/spec.md:288",
      "evidence": ["src/schema_comparator/config/models.py:8"]
    },
    {
      "id": "ci-linux-only",
      "summary": "Windows es la plataforma principal pero el CI solo ejecuta en ubuntu-latest",
      "documented": "docs/architecture/technical-baseline.md:79",
      "evidence": [".github/workflows/ci.yml:11"]
    }
  ]
}
