  "intent": {
    "kind": "bug",
    "summary": "Modificar una columna con índices, PK/UNIQUE, FK, estadísticas, DEFAULT o CHECK que dependen de ella: el script los elimina y los vuelve a crear con la misma definición dentro de la transacción, y aborta con un mensaje claro ante dependencias que no sabe recrear",
    "acceptance": "En SQL Server real, cambiar tipo, reducir, ampliar o pasar a NOT NULL una columna con índice, INCLUDE, PK referenciada por FK, UNIQUE, FK, estadística, DEFAULT o CHECK termina con la columna cambiada y cada dependencia recreada con su nombre y definición; ante una dependencia no soportada el script aborta antes de cambiar nada nombrándola; hoy falla con el error 4922 y no se aplica"
  },
  "facts": {
    "open": [
      "¿Cuál es la versión mínima de SQL Server que deben soportar los scripts: 2017 (permite STRING_AGG para regenerar índices) o 2012 (THROW y TRY_CONVERT ya lo exigen; obliga a FOR XML PATH)?",
      "Ante dependencias que exigen recrear objetos ajenos a la tabla (vistas con SCHEMABINDING, columnas calculadas, vistas indexadas, índices columnstore/XML/espaciales, particionados o full-text): ¿abortar con un mensaje que las nombra, o intentar recrear al menos vistas con SCHEMABINDING desde su definición en sys.sql_modules?",
      "Eliminar y recrear un índice clustered/PK reconstruye toda la tabla (lento y con bloqueo en tablas grandes): ¿solo avisar en el script e informe de impacto, o exigir una confirmación explícita en la TUI para ese paso?"
    ]
  },
