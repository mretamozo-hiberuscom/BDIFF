  "change": "script-preflight-state",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El script de consolidación comprueba antes de cambiar nada que cada objeto está como se comparó (o ya en el estado objetivo, y entonces lo omite), y antes del COMMIT verifica que cada cambio quedó aplicado; si no, aborta y deshace todo",
    "acceptance": "Si una columna a modificar no existe, una tabla a crear ya existe con otra definición o una columna difiere de lo comparado, el script aborta antes de cambiar nada con un mensaje que nombra el paso y el objeto; si el objeto ya está en el estado objetivo, ese paso se omite con un aviso; si tras aplicar un paso el objeto no quedó como se pedía, se deshace todo; hoy esos casos se saltan en silencio y se confirma la transacción"
  },
  "facts": {
    "basis": "Plan aprobado por el usuario en esta sesión (pregunta Orden: 'Robustez primero'): 'si el estado no es el observado en la comparación, aborta; si ya está en el estado objetivo, lo salta y lo imprime; al final verifica el resultado antes del COMMIT'. Los atributos comparados son los de ColumnAttributes leídos de INFORMATION_SCHEMA.COLUMNS (sqlserver/introspector.py:14)."
  },
