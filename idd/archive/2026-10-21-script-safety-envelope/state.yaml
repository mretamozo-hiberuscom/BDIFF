  "intent": {
    "kind": "bug",
    "summary": "Envoltorio de seguridad del script de consolidación T-SQL: no ejecutarse en otra base si USE falla, XACT_ABORT, THROW con el error original, LOCK_TIMEOUT, literales N'' y nombres escapados en OBJECT_ID, cabecera con instrucciones de ejecución",
    "acceptance": "Si la base del script no existe, ni sqlcmd ni el modo SSMS cambian nada en otra base; un error se relanza con su número original y la transacción se deshace; nombres no representables en la intercalación de la base o con ']' se crean, modifican y eliminan correctamente; el script incluye XACT_ABORT ON, LOCK_TIMEOUT y cómo ejecutarlo"
  },
  "facts": {
    "open": [
      "Cuando la cadena de conexión del perfil no indica Database/Initial Catalog, hoy se usa el nombre del perfil (ddl_renderer.py:140): ¿error al generar ese perfil, script que se niega a ejecutarse hasta editarlo, o mantener el nombre del perfil (la guarda de DB_NAME evitaría tocar otra base)?",
      "¿Qué LOCK_TIMEOUT usa el script antes de abortar por bloqueo: 30000 ms, 10000 ms u otro valor (o ninguno)?",
      "¿Se escriben los .sql en UTF-8 con BOM para que SSMS y sqlcmd en Windows los lean como UTF-8 sin -f 65001 (hoy sin BOM)?"
    ]
  },
