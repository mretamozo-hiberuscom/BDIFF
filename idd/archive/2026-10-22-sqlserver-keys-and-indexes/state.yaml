  "intent": {
    "request": "Extracción de PK, FK e índices (SQL Server primero, luego el resto)",
    "kind": "feature",
    "summary": "Extraer PK, FK e índices de SQL Server a TableSnapshot para que la comparación ya existente los detecte",
    "acceptance": "Dos bases SQL Server que difieren en una PK, FK o índice producen el hallazgo correspondiente; si son iguales no hay falsos positivos, incluidas las restricciones con nombre autogenerado"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué atributos entran en la igualdad de un índice: solo columnas y unicidad (hoy) o también clustered/nonclustered, orden ASC/DESC, columnas INCLUDE y filtro? ¿Y de una FK: acciones ON DELETE/UPDATE, y si está deshabilitada o NOCHECK?"
      },
      {
        "category": "uniqueness",
        "question": "SQL Server nombra PK, UNIQUE y FK sin nombre como PK__tabla__3213E83F...: el sufijo difiere entre bases y daría un falso hallazgo en cada tabla. ¿Se ignora el nombre cuando es autogenerado (is_system_named) o se compara siempre?"
      },
      {
