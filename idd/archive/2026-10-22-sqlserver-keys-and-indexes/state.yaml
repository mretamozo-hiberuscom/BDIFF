      "reason": "Los cambios caen en las capas esperadas: modelo en domain, consultas en infrastructure y redacción en report/tui; domain no importa nada nuevo."
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "No toca el registro de proveedores ni la carga diferida; solo el proveedor SQL Server amplía sus consultas."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "El modo y el modelo de tipos no cambian; las claves solo se comparan entre perfiles cuyo proveedor las extrae (SchemaFeature.KEYS), igual que las rutinas, para no inventar faltantes entre motores."
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "Solo consultas SELECT de catálogo; no se genera ni ejecuta DDL, y los hallazgos de claves son informativos."
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "No añade escrituras: ningún commit() nuevo ni operación de mantenimiento."
    },
    {
      "kind": "adr",
      "id": "0007",
      "impact": "amends",
      "reason": "Levanta la limitación 'las columnas de PK, FK e índices no se normalizan todavía' (identity.py las canonicaliza) y añade que los nombres de restricción autogenerados se comparan por estructura.",
