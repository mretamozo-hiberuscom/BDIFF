  "intent": {
    "kind": "bug",
    "summary": "El script de consolidación no inventa valores ni pierde datos en silencio: aborta con el número de filas afectadas cuando pasar a NOT NULL encuentra NULL sin default, o cuando un cambio de tipo, longitud o precisión truncaría, redondearía o no podría convertir valores, salvo que en la TUI se indique un valor de relleno o se acepte la pérdida para esa columna, lo que queda anotado en el script",
    "acceptance": "Con filas NULL y sin default ni valor de relleno, el script aborta antes de cambiar nada diciendo cuántas filas; con un valor de relleno las rellena con él (y aborta si no es convertible al tipo); reducir longitud, pasar nvarchar a varchar con caracteres no representables, bajar escala/precisión o cambiar a un tipo que no admite los valores aborta con el número de filas salvo que se acepte la pérdida, y entonces el script lo anota y lo aplica; ya no se usan 0, '' ni 1900-01-01 como relleno"
  },
  "facts": {
    "basis": "Decisión del usuario en esta sesión ('Cuando un cambio perdería datos...'): 'Abortar salvo decisión: por defecto aborta con el número de filas afectadas; en la TUI puedes indicar explícitamente un valor de relleno o aceptar la pérdida para esa columna, y queda anotado en el script'. Relleno inventado actual en sqlserver/ddl_renderer.py:93."
  },
