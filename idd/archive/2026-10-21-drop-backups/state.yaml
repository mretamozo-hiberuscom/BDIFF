  "intent": {
    "request": "queria hacer incapie en lo bueno que es el generador de scripts para solucionar los problemas, debe tener en cuenta las casuisticas más comunes y que en caso de error que no se apliquen a medias, que haya control de rollback, etc.. debe ser robusto y confiable",
    "kind": "feature",
    "summary": "Antes de cada DROP TABLE o DROP COLUMN el script de consolidación copia los datos al esquema bdiff_respaldo (PK + columna al eliminar una columna; la tabla entera, con aviso, si no hay PK) y anota en un diario las restricciones e índices que elimina con su definición, para poder deshacerlo",
    "acceptance": "Tras aplicar un script que elimina una tabla y una columna, bdiff_respaldo contiene bdiff_bak_<ts>_<tabla> con todas sus filas y bdiff_bak_<ts>_<tabla>_<columna> con la PK y los valores de la columna, y bdiff_diario_<ts> la definición de cada FK, índice o restricción eliminados; si un respaldo con ese nombre ya existe, el script aborta antes de cambiar nada; el informe de impacto lista los respaldos y cómo limpiarlos"
  },
