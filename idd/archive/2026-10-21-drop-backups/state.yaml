  "assumptions": [
    "Nombres: bdiff_bak_<ts>_<tabla> y bdiff_bak_<ts>_<tabla>_<columna>, con <ts> el de la generación; si superan 128 caracteres se recortan y se añade un sufijo hash para que sigan siendo únicos.",
