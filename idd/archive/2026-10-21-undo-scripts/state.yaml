  "assumptions": [
    "No se pueden restaurar los valores perdidos por una pérdida aceptada explícitamente en la TUI: el deshacer revierte la definición, no esos datos; su cabecera lo indica.",
    "Recrear una columna IDENTITY eliminada no se soporta (sus valores no se pueden reponer con UPDATE): ese paso del deshacer aborta con un mensaje.",
    "Si una columna eliminada se respaldó entera por no haber una PK sin ella, sus valores no se pueden emparejar: si era NOT NULL el deshacer aborta, si admite NULL queda NULL con aviso.",
    "Las restricciones e índices del diario se recrean al final del deshacer, tras restaurar todas las tablas y columnas, en el orden en que se eliminaron.",
    "Una tabla eliminada se recrea con sus columnas comparadas; sus índices y PK propios no se extraen y no se recrean (solo las FK de otras tablas hacia ella, desde el diario).",
    "CORRIGE el supuesto anterior sobre tablas eliminadas: el script normal anota en el diario también los índices, PK/UNIQUE, DEFAULT, CHECK y FK propios de la tabla que elimina, así que el deshacer la recrea con sus columnas comparadas y después todo lo anotado. Solo índices no rowstore, particionados o full-text no se anotan (se avisa)."
  ],
