schema: spec-driven

context: |
  Project: BDIFF, schema-drift comparator for microservice databases (dominio seguros).
  Tech stack: Python 3.11+ local CLI with optional Textual TUI; Windows is the
  primary platform, Linux supported. No server component.
  Purpose: compare N database schemas (SQL Server primary; PostgreSQL, MySQL,
  MariaDB, Oracle, SQLite) against the union of their objects, detect drift and
  generate console/HTML/PDF/Excel reports plus T-SQL consolidation scripts.
  Architecture: lightweight hexagonal (ADR 0001) with an internal provider
  registry (ADR 0002). Baseline: docs/architecture/technical-baseline.md.
  Testing: pytest (tests/unit, tests/integration); ruff for lint and format.
  Workflow: IDD by default (idd/config.yaml); openspec/specs are stale since
  2026-10-21 (see docs/architecture/component-map.yaml divergences).

scale: team

strict_tdd: false

project:
  version: "1.2.5"

  status: foundation-defined
  stack:
    languages: [python]
    frameworks: []
    package_managers: [pip, venv]
    architecture: "lightweight hexagonal CLI (presentation -> application -> domain; infrastructure providers)"
  commands:
    install: ["python -m venv .venv", "pip install -e .[dev,all]"]
    build: []
    test: ["python -m pytest -q"]
    lint: ["python -m ruff check .", "python -m ruff format --check ."]
    format: []
    typecheck: []

foundation:
  product_brief: docs/product/brief.md
  functional_scope: docs/product/functional-scope.md
  glossary: docs/product/glossary.md
  technical_baseline: docs/architecture/technical-baseline.md
  decisions: docs/architecture/decisions/README.md
  roadmap: docs/roadmap.md
  knowledge_map: docs/architecture/knowledge-map.yaml
  component_map: docs/architecture/component-map.yaml
  references_raw: docs/references/raw/README.md
  references_processed: docs/references/processed/README.md
  open_questions:
    - "Approx. number of databases per run is still an unvalidated assumption (3-20). Revisit before parallelizing extraction."
    - "No numeric success measures agreed (see docs/architecture/knowledge-map.yaml business.goals)."

capabilities:
  - name: python
    source: declared
  - name: sqlserver
    source: declared

testing:
  strict_tdd_mode: disabled
  detected: 2026-07-21
  test_runner:
    command: "python -m pytest -q"
    framework: "pytest"
  test_layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: "python -m pytest -q --cov=src"
  quality_tools:
    linter:
      available: true
      command: "python -m ruff check ."
    type_checker:
      available: false
      command: ""
    formatter:
      available: true
      command: "python -m ruff format --check ."
  notes: >
    pytest + pytest-cov; 406 tests passing on 2026-10-21. On Linux the SQL Server
    tests need the system ODBC manager (unixodbc).

rules:
  foundation:
    - Ask at most four questions per round, each with a recommended answer
    - Record divergences between docs and code in docs/architecture/component-map.yaml
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    patterns:
      - Follow existing code patterns
    tdd: false
    test_command: "python -m pytest -q"
  verify:
    test_command: "python -m pytest -q"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
